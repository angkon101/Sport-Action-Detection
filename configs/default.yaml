# Configuration for UCF101 Sports Action Recognition

experiment_name: "ucf101_sports_r2plus1d"
seed: 42

dataset:
  name: "ucf101_sports"
  data_dir: "data/raw"
  train_split: "data/splits/sports_trainlist01.txt"
  val_split: "data/splits/sports_testlist01.txt"
  num_classes: 45
  num_frames: 16              # Number of frames sampled per video clip
  frame_interval: 2           # Temporal sampling stride
  input_size: 224             # Spatial resolution (224x224)

model:
  backbone: "r2plus1d_18"     # Options: "r2plus1d_18", "r3d_18", "mc3_18", "s3d"
  pretrained: true            # Initialize with Kinetics-400 pretrained weights
  dropout: 0.5
  freeze_backbone: false      # Set true for linear probing / fast initial warm-up

training:
  batch_size: 8               # Fits within 4GB VRAM
  gradient_accumulation_steps: 2  # Effective batch size = 16
  num_workers: 2
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  mixed_precision: true       # Automatic Mixed Precision (fp16)

checkpoint:
  save_dir: "checkpoints"
  save_best_only: true
  metric: "top1_acc"
