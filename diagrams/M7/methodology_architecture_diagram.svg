  <text x="500.0" y="717.0" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Focal Loss &amp; Label Smoothing</text>
  <text x="500.0" y="732.0" font-size="10" fill="#888888" text-anchor="middle">Focuses on hard sports (γ=1.5, α=0.08)</text>
